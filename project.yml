name: Artora
options:
  bundleIdPrefix: com.artora
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  Artora:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Artora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artora.academy
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      testTargets:
        - ArtoraTests
  ArtoraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ArtoraTests
    dependencies:
      - target: Artora
